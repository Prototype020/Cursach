<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragClick</title>
    <link rel="stylesheet" href="Styles/styles.css">
</head>
<body>
     <div id="container">

        <header id="header">
            <div class="header-container">
                <div class="app-brand">
                    <div class="logo-icon">▣</div>
                    <h1>DragClick</h1>
                </div>
            </div>
        </header>
        
        <div id="navigation">
            <div class="nav-container">
                <!-- Кнопки действий -->
                <div class="action-group">
                    <button class="action-btn primary">
                        <span class="btn-icon">💾</span>
                        <span>Save</span>
                    </button>
                    <button class="action-btn secondary">
                        <span class="btn-icon">📂</span>
                        <span>Open</span>
                    </button>
                    <button class="action-btn accent">
                        <span class="btn-icon">📤</span>
                        <span>Export</span>
                    </button>
                </div>
                
                <div class="tool-divider"></div>
                
                <!-- Инструменты -->
                <div class="tool-group">
                    <button class="tool-btn" title="Zoom In">
                        <span class="tool-icon">+</span>
                    </button>
                    <span class="zoom-value">100%</span>
                    <button class="tool-btn" title="Zoom Out">
                        <span class="tool-icon">−</span>
                    </button>
                </div>
                
                <div class="tool-divider"></div>
                
            </div>
        </div>
        
        <div id="sidebar">
            <!-- Содержимое боковой панели без изменений -->
        
        </div>

        <div id="right-sidebar">
            
            
            <div class="sidebar-content">
                <div class="property-group">
                    <h4><i class="fas fa-palette"></i> Внешний вид</h4>
                    
                    <div class="property">
                        <label for="element-fill"><i class="fas fa-fill-drip"></i> Заливка</label>
                        <input type="color" id="element-fill" value="#FFD7B5">
                    </div>
                    
                    <div class="property">
                        <label for="element-stroke"><i class="fas fa-border-style"></i> Обводка</label>
                        <div class="color-input-wrapper">
                            <input type="color" id="element-stroke" value="#A78A7F">
                            <span class="color-value">#A78A7F</span>
                        </div>
                    </div>
                    
                    <div class="property">
                        <label for="element-stroke-width"><i class="fas fa-ruler-horizontal"></i> Толщина обводки</label>
                        <div class="range-wrapper">
                            <input type="range" id="element-stroke-width" min="1" max="10" value="2">
                            <span class="range-value">2px</span>
                        </div>
                    </div>
                </div>
                
                
                
                
                   
                
                
                
            </div>
        </div>




        
        <div id="field">
            <svg xmlns="http://www.w3.org/2000/svg" id = 'svgMain'>

                

            </svg>

        </div>

        <footer>

        </footer>

     </div>
     
     
    

    
    
    
    



    
    <script src="JS/SvgFieldScroll.js"></script>
    <script src="JS/navigation.js"></script>
    <script src="JS/ListnerFunctions.js"></script>
    <script src="JS/DefaultClasses.js"></script>
    <script src="JS/preformClasses.js"></script>
    

    <script src="JS/BasicFigures.js"></script>
    <script src="JS/left-sidebar.js"></script>
    <script src="JS/right-sidebar.js"></script>
    

    <script></script>
    
    
</body>
</html>
